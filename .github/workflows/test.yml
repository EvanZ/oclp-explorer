name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Test backend
        run: uv run pytest

      - name: Lint backend
        run: uv run ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cyclops
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v24
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/cyclops/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
